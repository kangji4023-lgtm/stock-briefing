name: Stock Auto Report

on:
  schedule:
    # 한국 시간(KST) 기준 오전 7시, 11시, 오후 3시, 오후 7시 자동 실행 매핑 (UTC 기준)
    - cron: '0 22,2,6,10 * * *'
  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests yfinance pykrx pandas

      - name: Run script
        env:
          PLAYMCP_WEBHOOK_URL: ${{ secrets.PLAYMCP_WEBHOOK_URL }}
        run: |
          python stock-briefing/Stock_bot.py
