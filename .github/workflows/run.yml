name: Stock Briefing Bot

on:
  schedule:
    - cron: '0 22,2,6,10 * * *'
    
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests pytz yfinance pykrx

      - name: Run stock briefing script
        env:
          TZ: Asia/Seoul
        run: |
          python stock_bot.py
