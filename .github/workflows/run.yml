name: Stock Bot Daily Automation

on:
  # 매일 지정된 시간에 자동 실행 (UTC 기준: 한국 시간 KST보다 9시간 느림)
  # KST 07:00 -> UTC 22:00 (전날), 11:00 -> 02:00, 16:00 -> 07:00, 19:00 -> 10:00
  schedule:
    - cron: '0 22,2,7,10 * * *'
  
  # 수동으로도 즉시 실행할 수 있도록 설정
  workflow_dispatch:

jobs:
  run-stock-bot:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 깃허브 레포지토리 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 파이썬 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3.필수 패키지 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy pykrx yfinance schedule

      # 4. 주식 봇 실행 (스크립트 파일명이 stock_bot.py인 경우)
      - name: Run stock bot script
        env:
          REST_API_KEY: ${{ secrets.REST_API_KEY }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          python stock_bot.py
