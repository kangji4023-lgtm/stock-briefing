name: Stock Briefing Bot

on:
  schedule:
    # 💡 [시간 설정 안내]
    # 아래 cron 예시는 한국 시간(KST) 기준 매일 오전 7시에 실행되도록 설정한 것입니다.
    # (UTC 기준 전날 22시 = KST 오전 7시)
    # 원하시는 시간에 맞춰 변경하세요. (예: 오전 8시 실행 원할 시 '0 23 * * *')
    - cron: '0 22 * * *'
    
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # 🌍 서버 전역 시간대를 대한민국(KST)으로 고정하여 시차 문제 원천 차단
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run stock briefing script
        run: |
          python main.py
        env:
          # 파이썬 내부 코드에서도 KST 시간을 명확히 가져오도록 환경 변수 전달
          TZ: Asia/Seoul
