name: run-stock-bot

on:
  workflow_dispatch: # 수동으로 즉시 실행할 수 있도록 허용
  schedule:
    - cron: '30 21 * * *' # 매일 한국 시간 아침 6시 30분 (UTC 기준 21시 30분) 실행

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 깃허브 레포지토리 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 파이썬 환경 설정 (버전 3.10)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. 필수 라이브러리 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy pykrx yfinance lxml

      # 4. 주식 브리핑 봇 실행 스크립트 구동
      - name: Run stock briefing script
        run: |
          python stock_bot.py
