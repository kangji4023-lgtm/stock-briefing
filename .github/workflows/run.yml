name: Send Stock Briefing

on:
  schedule:
    # KST 기준 아침 7시(22:00 UTC), 11시(02:00 UTC), 오후 4시(07:00 UTC), 저녁 7시(10:00 UTC) 설정
    - cron: '22 21,1,6,9 * * *'
  workflow_dispatch: # 수동으로도 실행 가능

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests yfinance pykrx pytz pandas numpy

      - name: Run stock briefing script
        run: python get_token.py  # 실행할 파이썬 파일 이름 (예: main.py 등 본인 파일명으로 수정)
