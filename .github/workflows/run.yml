name: Stock Market Briefing (Safe)

on:
  schedule:
    - cron: "07 22 * * *"
    - cron: "07 02 * * *"
    - cron: "07 07 * * *"
    - cron: "07 10 * * *"

  workflow_dispatch:

jobs:
  stock-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. 소스코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Python 환경 설정
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 필수 라이브러리 설치 및 주식 브리핑 실행을 한 번에 처리
      - name: Install dependencies and Run Stock Bot
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests numpy pandas yfinance beautifulsoup4 lxml html5lib pykrx==1.2.8
          python stock_bot.py
