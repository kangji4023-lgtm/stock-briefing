name: Stock Briefing Kakao

on:
  workflow_dispatch:

  schedule:
    # 한국시간 오전 7시
    - cron: '0 22 * * *'

    # 한국시간 오전 11시
    - cron: '0 2 * * *'

    # 한국시간 오후 4시
    - cron: '0 7 * * *'

    # 한국시간 오후 7시
    - cron: '0 10 * * *'

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pykrx pandas numpy pytz

      - name: Check Secrets
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: |
          echo "===================================="
          echo "Kakao Secret 확인"
          echo "===================================="

          if [ -z "$KAKAO_REST_API_KEY" ]; then
            echo "❌ KAKAO_REST_API_KEY 없음"
            exit 1
          else
            echo "✅ KAKAO_REST_API_KEY 확인"
          fi

          if [ -z "$KAKAO_REFRESH_TOKEN" ]; then
            echo "❌ KAKAO_REFRESH_TOKEN 없음"
            exit 1
          else
            echo "✅ KAKAO_REFRESH_TOKEN 확인"
          fi

          if [ -z "$KAKAO_CLIENT_SECRET" ]; then
            echo "ℹ️ KAKAO_CLIENT_SECRET 없음 - 선택사항"
          else
            echo "✅ KAKAO_CLIENT_SECRET 확인"
          fi

      - name: Python Syntax Check
        run: |
          python -m py_compile stock_bot.py
          echo "✅ stock_bot.py 문법 검사 완료"

      - name: Run Stock Briefing
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: |
          python stock_bot.py
