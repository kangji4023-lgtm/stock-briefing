name: Stock Briefing Pro Bot

on:
  schedule:
    # 한국 시간(KST) 기준: 07:00, 11:00, 16:00, 19:00
    # UTC 변환: 22:00(전날), 02:00, 07:00, 10:00
    - cron: '0 22,2,7,10 * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pykrx yfinance pandas numpy

      - name: Run stock briefing script
        env:
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          # 필요한 경우 KRX_ID, KRX_PW 등도 추가 가능
        run: python stock_bot.py
