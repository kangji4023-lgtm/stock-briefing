name: Stock Briefing Bot

on:
  schedule:
    # 한국 시간(KST) 오전 7:00 = UTC 전날 22:00
    - cron: '0 22 * * *'
    
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # 서버 전역 시간대를 대한민국(KST)으로 고정
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; elif [ -f stock-briefing/requirements.txt ]; then pip install -r stock-briefing/requirements.txt; fi

      - name: Run stock briefing script
        run: |
          # 폴더 구조에 맞게 자동으로 파일을 찾아 실행하도록 경로 조정
          if [ -f "main.py" ]; then
            python main.py
          elif [ -f "stock-briefing/main.py" ]; then
            python stock-briefing/main.py
          else
            echo "Error: main.py not found!"
            exit 1
          fi
        env:
          TZ: Asia/Seoul
