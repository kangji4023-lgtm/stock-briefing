name: Stock Market Briefing (Production)

on:
  # ==========================================================
  # [실전용 스케줄 설정]
  # GitHub 서버 부하를 피하기 위해 분 단위를 정각에서 살짝 비껴나게 설정했습니다.
  # 이 설정이 실제 서비스 운영 시 '정시 전송' 확률이 가장 높습니다.
  # ==========================================================
  schedule:
    - cron: "05 22 * * *"  # 한국시간 07:05 (장 시작 전 브리핑)
    - cron: "05 02 * * *"  # 한국시간 11:05 (오전 시장 요약)
    - cron: "05 07 * * *"  # 한국시간 16:05 (장 마감 브리핑)
    - cron: "05 10 * * *"  # 한국시간 19:05 (오늘의 뉴스 요약)

  # 필요할 때 언제든 수동으로 즉시 전송 가능하도록 유지
  workflow_dispatch:

jobs:
  stock-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 권한 설정: 60일 비활성화 방지를 위해 저장소 콘텐츠 접근 권한 필요
    permissions:
      contents: write

    steps:
      # 1. 소스코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Python 환경 설정 (캐시 사용으로 실행 속도 향상)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      # 3. 필수 라이브러리 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pykrx==1.2.8 pandas numpy yfinance requests pytz

      # 4. 주식 브리핑 실행 (실전 운영)
      - name: Run Stock Bot
        env:
          # KRX 및 카카오 API 설정 (GitHub Secrets에 등록된 값 사용)
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: |
          python stock_bot.py

      # 5. [중요] 60일 자동 비활성화 방지 (Keep Alive)
      # 60일 동안 커밋이 없어도 스케줄이 멈추지 않도록 자동으로 빈 커밋을 생성합니다.
      - name: Keep Workflow Active
        uses: gautamkrishnar/keepalive-workflow@v1
        if: always()
