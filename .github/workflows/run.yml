name: Stock Bot Daily Automation

on:
  schedule:
    - cron: '0 22,2,7,10 * * *'
  workflow_dispatch:

jobs:
  run-stock-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # cache: 'pip'  <- 이 줄을 삭제하거나 주석 처리하세요.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy pykrx yfinance schedule

      - name: Run stock bot script
        env:
          REST_API_KEY: ${{ secrets.REST_API_KEY }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          python stock_bot.py
