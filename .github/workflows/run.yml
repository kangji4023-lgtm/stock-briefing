name: Stock Briefing Multi-Time Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *' # 매일 아침 7시 00분 (KST)
    - cron: '0 2 * * *'  # 매일 오전 11시 00분 (KST)
    - cron: '0 7 * * *'  # 매일 오후 4시 00분 (KST)
    - cron: '0 10 * * *' # 매일 저녁 7시 00분 (KST)

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run main.py
        env:
          KAKAO_TOKEN: ${{ secrets.KAKAO_TOKEN }}
        run: |
          python main.py

