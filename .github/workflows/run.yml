name: Stock Briefing Automation

on:
  workflow_dispatch:
  schedule:
    # 1. 한국 시간 기준 오전 7시 (UTC 22시 - 전날 밤 10시)
    - cron: '0 22 * * *'
    
    # 2. 한국 시간 기준 오전 11시 (UTC 2시)
    - cron: '0 2 * * *'
    
    # 3. 한국 시간 기준 오후 4시 (UTC 7시)
    - cron: '0 7 * * *'
    
    # 4. 한국 시간 기준 오후 7시 (UTC 10시)
    - cron: '0 10 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade requests yfinance pykrx pandas numpy

      - name: Run script
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: |
          python stock_bot.py
