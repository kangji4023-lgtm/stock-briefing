name: Stock Market Briefing (Safe)

on:
  schedule:
    # 한국시간 기준 (UTC + 9)
    # 서버 부하를 피하기 위해 분 단위를 정각(00분)에서 변경했습니다.
    - cron: "07 22 * * *"  # 한국시간 07:07
    - cron: "07 02 * * *"  # 한국시간 11:07
    - cron: "07 07 * * *"  # 한국시간 16:07
    - cron: "07 10 * * *"  # 한국시간 19:07

  workflow_dispatch:

jobs:
  stock-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. 소스코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Python 환경 설정
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 필수 라이브러리 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pykrx==1.2.8 pandas numpy yfinance requests pytz

      # 4. 주식 브리핑 실행
      - name: Run Stock Bot
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: |
          python stock_bot.py
