name: Stock Briefing Bot

on:
  # 매일 오전 7시, 11시 / 오후 4시, 7시 (UTC 기준 시간 설정 필요: 한국 시간 KST 기준 오전 7시는 UTC 22시 전날)
  # 편의를 위해 매일 주요 시간에 실행되도록 설정한 Cron 예시입니다.
  schedule:
    - cron: '0 22,2 * * *'  # 한국 시간 오전 7시, 11시 (UTC 기준 22시, 2시)
    - cron: '0 7,10 * * *'  # 한국 시간 오후 4시, 7시 (UTC 기준 7시, 10시)
  
  # 수동으로도 실행할 수 있도록 설정
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run stock briefing script
        run: python stock_bot.py
