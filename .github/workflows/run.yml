name: Stock Briefing Bot

on:
  schedule:
    # 한국 시간(KST) 오전 7:00 = UTC 전날 22:00
    - cron: '0 22 * * *'
    
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 현재 폴더나 하위 폴더에 requirements.txt가 있으면 설치
          find . -name "requirements.txt" -exec pip install -r {} \;

      - name: Run stock briefing script
        run: |
          # 현재 디렉토리 구조 출력 (디버깅용)
          echo "=== Current Directory Contents ==="
          ls -R
          
          # 파일 구조에 상관없이 시스템 전체에서 main.py를 찾아 바로 실행
          MAIN_PATH=$(find . -name "main.py" | head -n 1)
          
          if [ -z "$MAIN_PATH" ]; then
            echo "Error: main.py not found anywhere!"
            exit 1
          fi
          
          echo "Found main.py at: $MAIN_PATH"
          python "$MAIN_PATH"
        env:
          TZ: Asia/Seoul
