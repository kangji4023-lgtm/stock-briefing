name: Stock Market Briefing

on:
  # ==========================================================
  # 한국시간
  #
  # GitHub Actions cron은 UTC 기준입니다.
  #
  # 한국시간 07:00 → UTC 22:00 전날
  # 한국시간 11:00 → UTC 02:00
  # 한국시간 16:00 → UTC 07:00
  # 한국시간 19:00 → UTC 10:00
  # ==========================================================

  schedule:
    - cron: "0 22 * * *"
    - cron: "0 2 * * *"
    - cron: "0 7 * * *"
    - cron: "0 10 * * *"

  # GitHub에서 직접 실행
  workflow_dispatch:

jobs:

  stock-briefing:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ======================================================
      # 1. 소스코드 가져오기
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ======================================================
      # 2. Python 설치
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ======================================================
      # 3. pip 업데이트
      # ======================================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # ======================================================
      # 4. 필요한 라이브러리 설치
      #
      # pykrx 1.2.8
      # 2026 KRX 로그인 정책 대응 버전
      # ======================================================

      - name: Install dependencies
        run: |
          pip install --upgrade \
            pykrx==1.2.8 \
            pandas \
            numpy \
            yfinance \
            requests \
            pytz

      # ======================================================
      # 5. 환경변수 확인
      #
      # 실제 값은 출력하지 않습니다.
      # ======================================================

      - name: Check Secrets
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: |
          echo "=============================="
          echo "Secret 설정 확인"
          echo "=============================="

          if [ -n "$KRX_ID" ]; then
            echo "KRX_ID: OK"
          else
            echo "KRX_ID: MISSING"
          fi

          if [ -n "$KRX_PW" ]; then
            echo "KRX_PW: OK"
          else
            echo "KRX_PW: MISSING"
          fi

          if [ -n "$KAKAO_REST_API_KEY" ]; then
            echo "KAKAO_REST_API_KEY: OK"
          else
            echo "KAKAO_REST_API_KEY: MISSING"
          fi

          if [ -n "$KAKAO_REFRESH_TOKEN" ]; then
            echo "KAKAO_REFRESH_TOKEN: OK"
          else
            echo "KAKAO_REFRESH_TOKEN: MISSING"
          fi

          if [ -n "$KAKAO_CLIENT_SECRET" ]; then
            echo "KAKAO_CLIENT_SECRET: OK"
          else
            echo "KAKAO_CLIENT_SECRET: NOT SET"
          fi

      # ======================================================
      # 6. 주식 브리핑 실행
      # ======================================================

      - name: Run stock bot
        env:

          # --------------------------------------------------
          # KRX
          # --------------------------------------------------

          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}

          # --------------------------------------------------
          # Kakao
          # --------------------------------------------------

          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}

          # --------------------------------------------------
          # Python
          # --------------------------------------------------

          PYTHONUNBUFFERED: "1"

        run: |
          echo "=============================="
          echo "📊 Stock Bot 시작"
          echo "=============================="

          python stock_bot.py

      # ======================================================
      # 7. 실행 결과
      # ======================================================

      - name: Finish
        if: always()
        run: |
          echo "=============================="
          echo "Stock Market Briefing 종료"
          echo "=============================="
