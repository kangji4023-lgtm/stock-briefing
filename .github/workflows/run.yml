name: Stock Briefing Bot

on:
  schedule:
    # 한국 시간(KST) 오전 7:00 = UTC 전날 22:00
    - cron: '0 22 * * *'
    
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt가 있으면 설치하고, 없거나 부족하면 필수 라이브러리 강제 설치
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
          # 주식 봇 구동에 일반적으로 필요한 라이브러리 안전장치 설치
          pip install numpy pandas requests pytz
          
      - name: Run stock briefing script
        run: |
          if [ -f "stock_bot.py" ]; then
            python stock_bot.py
          else
            echo "Error: stock_bot.py not found!"
            exit 1
          fi
        env:
          TZ: Asia/Seoul
