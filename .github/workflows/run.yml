name: Send Stock Briefing

on:
  workflow_dispatch:  # 수동 실행 버튼 활성화
  schedule:
    # 매일 한국 시간 기준 아침 7시 0분에 자동 실행 (UTC 시간 기준 밤 10시에 해당)
    - cron: '0 22 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests yfinance pykrx pandas numpy pytz

      - name: Run stock briefing script
        run: python stock_bot.py
