name: Stock Bot Daily Automation

on:
  schedule:
    # KST 기준 07:00, 11:00, 16:00, 19:00 (UTC 기준 22, 2, 7, 10시)
    - cron: '0 22,2,7,10 * * *'
  workflow_dispatch:

jobs:
  run-stock-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy pykrx yfinance

      - name: Run stock briefing script
        env:
          REST_API_KEY: ${{ secrets.REST_API_KEY }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          python stock_bot.py
