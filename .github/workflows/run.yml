name: 주식 시장 브리핑 (안전)

on:
  schedule:
    - cron: '30 22 * * 0-4' # 예시 스케줄 (필요에 따라 조정 가능)
  workflow_dispatch: # <-- 수동 실행(전송)을 위한 트리거 추가

jobs:
  stock-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. 소스코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Python 환경 설정
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 필수 라이브러리 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests numpy

      # 4. 주식 브리핑 실행
      - name: Run Stock Bot
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: |
          python stock_bot.py
