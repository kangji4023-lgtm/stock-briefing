name: Stock Briefing Bot

on:
  schedule:
    # 한국 시간(KST) 기준 매일 오전 7시 정각 실행 (UTC 전날 22시)
    - cron: '0 22 * * *'
    
  workflow_dispatch: # GitHub 웹에서 수동 실행 버튼 활성화

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # 서버 전역 시간대를 대한민국(KST)으로 고정
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt 파일이 있으면 설치
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
          # stock_bot.py 구동에 필요한 필수 라이브러리 강제 설치
          pip install numpy pandas requests pytz yfinance

      - name: Run stock briefing script
        run: |
          # stock_bot.py 파일 존재 여부 확인 후 실행
          if [ -f "stock_bot.py" ]; then
            python stock_bot.py
          else
            echo "Error: stock_bot.py not found!"
            exit 1
          fi
        env:
          TZ: Asia/Seoul
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
