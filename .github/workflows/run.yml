name: Send Stock Briefing

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'  # 한국 아침 7시
    - cron: '0 2 * * *'   # 한국 오전 11시
    - cron: '0 7 * * *'   # 한국 오후 4시
    - cron: '0 10 * * *'  # 한국 저녁 7시

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests yfinance pykrx pandas numpy pytz

      - name: Run stock briefing script
        run: python stock_bot.py
