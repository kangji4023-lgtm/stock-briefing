name: Stock Briefing Bot

on:
  schedule:
    - cron: '0 22,2 * * *'  # 한국 시간 오전 7시, 11시 (UTC 기준)
    - cron: '0 7,10 * * *'  # 한국 시간 오후 4시, 7시 (UTC 기준)
  
  workflow_dispatch:  # 수동 실행 버튼 활성화

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pykrx yfinance

      - name: Run stock briefing script
        run: python stock_bot.py

      - name: Run stock briefing script
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python stock_bot.py
