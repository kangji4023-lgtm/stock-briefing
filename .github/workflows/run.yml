name: Stock Briefing Bot

on:
  schedule:
    # 한국 시간(KST) 오전 7:00 = UTC 전날 22:00
    - cron: '0 22 * * *'
    
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # stock-briefing 폴더가 존재하면 그 안의 requirements.txt 설치
          if [ -f "stock-briefing/requirements.txt" ]; then
            pip install -r stock-briefing/requirements.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: Run stock briefing script
        run: |
          # stock-briefing 폴더 안으로 이동해서 main.py 실행 (폴더가 있는 경우)
          if [ -d "stock-briefing" ]; then
            cd stock-briefing
          fi
          
          python main.py
        env:
          TZ: Asia/Seoul
