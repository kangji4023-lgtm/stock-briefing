name: Stock Multi Briefing Bot

on:
  schedule:
    # 한국 시간(KST) 기준 하루 4번 실행 (오전 7시, 11시, 오후 4시, 7시)
    - cron: '0 22 * * *'  # 오전 7:00 (KST)
    - cron: '0 2 * * *'   # 오전 11:00 (KST)
    - cron: '0 7 * * *'   # 오후 4:00 (KST)
    - cron: '0 10 * * *'  # 오후 7:00 (KST)
    
  workflow_dispatch: # 수동 테스트 버튼

jobs:
  run-briefing-bot:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests yfinance pykrx

      - name: Run stock bot script
        run: |
          python stock_bot.py
        env:
          TZ: Asia/Seoul
