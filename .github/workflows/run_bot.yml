name: Stock Multi Briefing Bot

on:
  schedule:
    # 한국 시간(KST) 기준 하루 4번 실행 (UTC 시간 기준)
    - cron: '0 22 * * *'  # 오전 7:00 (KST)
    - cron: '0 2 * * *'   # 오전 11:00 (KST)
    - cron: '0 7 * * *'   # 오후 4:00 (16:00, KST)
    - cron: '0 10 * * *'  # 오후 7:00 (19:00, KST)
    
  workflow_dispatch: # GitHub Actions 탭에서 수동 실행 버튼 활성화

jobs:
  run-briefing-bot:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests yfinance

      - name: Run stock bot script
        run: |
          python stock_bot.py
        env:
          TZ: Asia/Seoul
