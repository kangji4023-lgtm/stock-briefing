name: Analyst Morning Briefing

on:
  schedule:
    # 한국 시간(KST) 기준 매일 오전 7시 30분 정각 실행 (UTC 전날 22시 30분)
    - cron: '30 22 * * *'
    
  workflow_dispatch: # GitHub Actions 탭에서 수동 실행 버튼 활성화

jobs:
  run-analyst-bot:
    runs-on: ubuntu-latest
    
    # 서버 시간대를 대한민국(KST)으로 고정
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests yfinance

      - name: Run analyst script
        run: |
          python analyst_bot.py
        env:
          TZ: Asia/Seoul
