name: Stock Market Kakao Briefing

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions cron은 UTC 기준입니다.
    # 한국시간(KST)은 UTC+9입니다.
    #
    # 오전 7시  -> UTC 전날 22:00
    # 오전 11시 -> UTC 02:00
    # 오후 4시  -> UTC 07:00
    # 오후 7시  -> UTC 10:00

    - cron: "0 22 * * *"
    - cron: "0 2 * * *"
    - cron: "0 7 * * *"
    - cron: "0 10 * * *"

jobs:
  stock-bot:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. 저장소 코드 가져오기
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. Python 3.11
      # =====================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # =====================================================
      # 3. Python 패키지 설치
      # =====================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install pandas
          pip install pytz
          pip install requests
          pip install yfinance
          pip install pykrx

      # =====================================================
      # 4. 주식 브리핑 실행
      # =====================================================
      - name: Run stock briefing script
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}

        run: |
          echo "=========================================="
          echo "Stock Bot 시작"
          echo "=========================================="

          echo "GitHub UTC:"
          date -u

          echo "한국시간(KST):"
          TZ=Asia/Seoul date

          echo "=========================================="
          echo "Secret 상태"
          echo "=========================================="

          if [ -n "$KAKAO_REST_API_KEY" ]; then
            echo "KAKAO_REST_API_KEY = OK"
          else
            echo "KAKAO_REST_API_KEY = MISSING"
          fi

          if [ -n "$KAKAO_REFRESH_TOKEN" ]; then
            echo "KAKAO_REFRESH_TOKEN = OK"
          else
            echo "KAKAO_REFRESH_TOKEN = MISSING"
          fi

          if [ -n "$KAKAO_CLIENT_SECRET" ]; then
            echo "KAKAO_CLIENT_SECRET = SET"
          else
            echo "KAKAO_CLIENT_SECRET = NOT SET (선택)"
          fi

          echo "=========================================="
          echo "stock_bot.py 실행"
          echo "=========================================="

          python stock_bot.py

      # =====================================================
      # 5. 성공
      # =====================================================
      - name: Success
        if: success()
        run: |
          echo "=========================================="
          echo "SUCCESS"
          echo "주식 브리핑 실행 및 카카오톡 전송 완료"
          echo "=========================================="

      # =====================================================
      # 6. 실패
      # =====================================================
      - name: Failure
        if: failure()
        run: |
          echo "=========================================="
          echo "FAILED"
          echo "stock_bot.py 실행 중 오류가 발생했습니다."
          echo "위의 로그를 확인하세요."
          echo "=========================================="
