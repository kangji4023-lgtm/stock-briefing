name: Stock Market Kakao Briefing

on:
  workflow_dispatch:

  schedule:
    # 한국시간(KST)
    # 오전 7시  → UTC 22:00
    # 오전 11시 → UTC 02:00
    # 오후 4시  → UTC 07:00
    # 오후 7시  → UTC 10:00
    - cron: "0 22 * * *"
    - cron: "0 2 * * *"
    - cron: "0 7 * * *"
    - cron: "0 10 * * *"

jobs:
  stock-bot:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. GitHub 저장소 코드 가져오기
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. Python 설치
      # =====================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # =====================================================
      # 3. 필요한 Python 패키지 설치
      # =====================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas
          pip install pytz
          pip install requests
          pip install yfinance
          pip install pykrx

      # =====================================================
      # 4. Secret 환경변수 설정
      # =====================================================
      - name: Run stock bot
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}

        run: |
          echo "=========================================="
          echo "Stock Bot 시작"
          echo "한국시간:"
          TZ=Asia/Seoul date
          echo "=========================================="

          python stock_bot.py

      # =====================================================
      # 5. 실행 완료
      # =====================================================
      - name: Completed
        if: success()
        run: |
          echo "=========================================="
          echo "Stock Bot 실행 성공"
          echo "카카오톡 브리핑 전송 완료"
          echo "=========================================="

      # =====================================================
      # 6. 실행 실패
      # =====================================================
      - name: Failed
        if: failure()
        run: |
          echo "=========================================="
          echo "Stock Bot 실행 실패"
          echo "GitHub Actions 로그를 확인하세요."
          echo "=========================================="
